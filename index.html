<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SondaMERCADO</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">SondaMERCADO</div>
  <div id="loggedUser" class="logged-user hidden"></div>
</header>

<main class="container">

  <section id="loginScreen" class="auth-card">
    <div id="loginForm">
      <h1>Entrar</h1>
      <p class="subtitle">Acesse sua conta para continuar.</p>

      <label for="loginUsername">Usuário</label>
      <input id="loginUsername" type="text" autocomplete="username" placeholder="Digite seu usuário">

      <label for="loginPassword">Senha</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Digite sua senha">

      <button id="loginButton" class="btn btn-green btn-full">Confirmar</button>
      <button id="openRegisterButton" class="btn btn-light btn-full">Cadastrar</button>
      <p id="loginMessage" class="message"></p>
    </div>

    <div id="registerForm" class="hidden">
      <h1>Criar conta</h1>
      <p class="subtitle">Cadastre seu acesso ao SondaMERCADO.</p>

      <label for="registerName">Nome</label>
      <input id="registerName" type="text" placeholder="Seu nome">

      <label for="registerUsername">Usuário</label>
      <input id="registerUsername" type="text" autocomplete="username" placeholder="Escolha um usuário">

      <label for="registerPassword">Senha</label>
      <input id="registerPassword" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres">

      <button id="registerButton" class="btn btn-green btn-full">Cadastrar</button>
      <button id="backLoginButton" class="btn btn-light btn-full">Voltar</button>
      <p id="registerMessage" class="message"></p>
    </div>
  </section>

  <section id="appScreen" class="hidden">
    <nav class="nav">
      <button id="productsButton" class="btn">Produtos</button>
      <button id="cartButton" class="btn">Minha lista (<span id="cartCount">0</span>)</button>
      <button id="profileButton" class="btn">Meu perfil</button>
      <button id="logoutButton" class="btn btn-dark">Sair</button>
    </nav>

    <p id="appMessage" class="message"></p>

    <section id="productsView" class="page-card">
      <div class="section-header">
        <div>
          <h2>Produtos</h2>
          <p class="subtitle">Escolha a quantidade e adicione à sua lista.</p>
        </div>
        <input id="searchProducts" class="search" type="search" placeholder="Buscar produto...">
      </div>
      <div id="productsGrid" class="products-grid"></div>
    </section>

    <section id="cartView" class="page-card hidden">
      <h2>Minha lista de compras</h2>
      <p class="subtitle">Altere quantidades ou remova itens.</p>
      <div id="cartList"></div>
      <div id="cartTotal" class="cart-total"></div>
    </section>

    <section id="profileView" class="page-card hidden">
      <h2>Meu perfil</h2>
      <div class="profile-card">
        <p><strong>Nome:</strong> <span id="profileNameText"></span></p>
        <p><strong>Usuário:</strong> <span id="profileUsernameText"></span></p>
      </div>
      <label for="profileNameInput">Nome</label>
      <input id="profileNameInput" type="text" placeholder="Seu nome">
      <button id="saveProfileButton" class="btn btn-green">Salvar perfil</button>
    </section>
  </section>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
